# web 前端容器托管配置（P2-3）：SPA 静态托管 + /api 同源反代 backend:8000。
# 同源反代方案 ⇒ 后端 CORS 零改动（浏览器只见同源请求），顺带解决 SSE 跨域。
# SSE 要点：proxy_buffering off（否则 nginx 攒缓冲、事件不实时）+
# HTTP/1.1 + Connection ""（keep-alive 到上游，避免连接被提前掐断）+
# proxy_read_timeout 拉长（长流式响应不中途超时）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源（vite build 带 hash 的 assets）：长缓存。
    # immutable 合法性：内容寻址（hash 文件名）+ 无鉴权纯静态——
    # 已登记 tests/test_p44_cache_semantics.py 的 PUBLIC_IMMUTABLE_ALLOWLIST
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 同源反代：/api/v1/... → backend:8000/api/v1/...（SSE 流式同走此路径）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：禁缓冲 + 拉长读超时（0 = 不限时）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA fallback：前端路由全部回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
