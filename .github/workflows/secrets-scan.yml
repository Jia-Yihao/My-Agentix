name: Secrets scan

# 全历史扫描已提交的密钥 / 令牌。gitleaks 需要完整历史才能比对历史提交，
# 因此 fetch-depth: 0 —— 浅克隆会让"历史里漏进去的密钥"扫不出来。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
