name: Release

# 打 tag（v*.*.*）即发布：先做 preflight（版本四处一致 + 标签与包版本一致），
# 再构建 sdist/wheel。
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key-not-used-in-ci
      DATABASE_URL: sqlite:///./ci_release.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      - name: Version sources agree
        run: python scripts/bump_version.py --check
      # 标签与包版本必须同源：不一致意味着 tag 打错或版本没抬，发出去的包会自述
      # 一个从未存在的版本号。
      - name: Tag matches package version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          CURRENT="$(python -c 'import agentix; print(agentix.__version__)')"
          if [ "$TAG" != "$CURRENT" ]; then
            echo "::error title=release::tag v${TAG} != agentix.__version__ ${CURRENT}"
            exit 1
          fi

  build:
    name: Build distributions
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
