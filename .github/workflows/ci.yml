name: CI

# 与 docs/项目实现手册.md §21.2 的作业清单对应；本地等价命令见 Makefile。
# 改这里的 lint 范围必须同步改 Makefile，否则两边量的是不同的东西。
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # pyproject / agentix.__version__ / web/package.json / .env.example 必须四处一致。
      - name: Check version sources agree
        run: python scripts/bump_version.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install toolchain
        run: pip install -r requirements-dev.txt
      # 范围与 Makefile 的 lint 目标逐字一致。
      - name: Ruff
        run: ruff check agentix scripts evals kb_ingest --output-format=github
      # 仓库尚未全量格式化，这一步只报告不阻断；Makefile 用行首 `-` 表达同一语义。
      - name: Formatting check (non-blocking)
        continue-on-error: true
        run: black --check --diff agentix scripts evals kb_ingest
      # 只覆盖 domain 层（pyproject 里 follow_imports="silent" + 该层 untyped 禁令）。
      - name: Type check (domain layer)
        run: mypy agentix/domain --config-file=pyproject.toml

  import-integrity:
    name: Import integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      # 只验装配：跨层引用与命名没被搬坏。
      - name: Import integrity
        run: |
          set -eu
          python -c "import agentix.domain.ports.retrieval"
          python -c "import agentix.retrieval.usecases.retrieval_port_adapter"
          python -c "import agentix.retrieval.usecases.kb_service"
          python -c "import agentix.retrieval.api.authz"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ci-gate:
    name: CI gate
    needs:
      - version-consistency
      - lint
      - import-integrity
      - frontend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          blocking = [r for r in results if r in ("failure", "cancelled")]
          if blocking:
              print(f"::error title=ci-gate::blocking jobs are not green: {blocking}")
              sys.exit(1)
          print(f"ci-gate PASS: {len(results)} jobs green")
          PY
