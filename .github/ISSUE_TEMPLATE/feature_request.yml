name: 功能请求
description: 提出新功能、新工具 / Agent / Provider 或新领域适配
title: "[feat] "
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        新增能力请先看 `docs/architecture/README.md` 与
        `CONTRIBUTING.md` 的「新增能力指南」，分层约束会直接决定实现落在哪一层。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 谁在什么场景下受阻？没有这个功能时你怎么绕过去？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 接口形态、配置项、落在哪一层（domain / application / infrastructure / interfaces）。
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 能力类型
      options:
        - 新 Tool
        - 新 Agent 子图 / 节点
        - 新 LLM / Embedding / Reranker Provider
        - 新领域适配
        - 评测 / 可观测
        - 其他
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 怎样算完成
      description: 可验证的判据（命令、指标、测试名）。CI 门禁口径见 evals/quality_gate.py。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue / 讨论，确认不是重复
          required: true
        - label: 愿意提交 PR（可选，但会显著加快落地）
          required: false
