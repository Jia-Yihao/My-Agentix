# My Agentix Prometheus 抓取与告警配置（企业化 P0-2）
# 抓取目标：backend 主服务的 /metrics 端点（P0-1 暴露）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # 告警恢复前的等待时间，避免抖动
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager: 9093

scrape_configs:
  - job_name: agentix-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: agentix
          component: backend

  - job_name: prometheus-self
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager-self
    static_configs:
      - targets:
          - alertmanager: 9093
